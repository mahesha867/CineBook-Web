# =====================================================================
# CineBook Web - Application Configuration
# =====================================================================

spring.application.name=CineBook-Web
server.port=8080

# Database Connectivity (Raw JDBC via HikariCP + JdbcTemplate)
# Supports environment variable overrides: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cinebook_web?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# Static Resources Handling (Serves modern frontend directly from classpath)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# CineBook Business Logic Properties
cinebook.booking.hold-duration-minutes=5
cinebook.booking.cancellation-refund-rate=0.80
cinebook.admin.default-username=admin
cinebook.admin.default-password=admin123

# Logging Configuration
logging.level.com.cinebook=DEBUG
logging.level.org.springframework.jdbc=INFO

